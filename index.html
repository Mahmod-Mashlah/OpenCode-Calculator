<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funky OpenCode Calculator 0_0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

    <div class="top-btns">
        <button class="top-btn mute-btn" id="muteBtn" title="Toggle sound">&#128264;</button>
        <button class="top-btn theme-toggle" id="themeToggle" title="Toggle theme">&#9790;</button>
    </div>

    <div class="calculator" id="app">
        <div class="calc-brand calc-brand-calc">&#9835; FUNKY CALC &#9835;</div>
        <div class="calc-brand calc-brand-conv" style="display:none;">&#8644; FUNKY CONVERT &#8644;</div>

        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="calc">&#9835; CALC</button>
            <button class="mode-tab" data-mode="conv">&#8644; CONVERT</button>
        </div>

        <div class="panel active" id="panel-calc">
            <div class="display" id="calcDisplay">
                <div class="expression" id="expression"></div>
                <div class="result" id="result">0</div>
            </div>

            <div class="row g-2 btn-row">
                <div class="col-3"><button class="btn-calc paren" data-val="(">(</button></div>
                <div class="col-3"><button class="btn-calc paren" data-val=")">)</button></div>
                <div class="col-3"><button class="btn-calc clear" data-val="C">C</button></div>
                <div class="col-3"><button class="btn-calc delete" data-val="DEL">DEL</button></div>
            </div>
            <div class="row g-2 btn-row">
                <div class="col-3"><button class="btn-calc plusminus" data-val="±">±</button></div>
                <div class="col-3"><button class="btn-calc percent" data-val="%">%</button></div>
                <div class="col-3"><button class="btn-calc operator" data-val="/">&divide;</button></div>
                <div class="col-3"><button class="btn-calc operator" data-val="*">&times;</button></div>
            </div>
            <div class="row g-2 btn-row">
                <div class="col-3"><button class="btn-calc number" data-val="7">7</button></div>
                <div class="col-3"><button class="btn-calc number" data-val="8">8</button></div>
                <div class="col-3"><button class="btn-calc number" data-val="9">9</button></div>
                <div class="col-3"><button class="btn-calc operator" data-val="-">&minus;</button></div>
            </div>
            <div class="row g-2 btn-row">
                <div class="col-3"><button class="btn-calc number" data-val="4">4</button></div>
                <div class="col-3"><button class="btn-calc number" data-val="5">5</button></div>
                <div class="col-3"><button class="btn-calc number" data-val="6">6</button></div>
                <div class="col-3"><button class="btn-calc operator" data-val="+">+</button></div>
            </div>
            <div class="row g-2 btn-row">
                <div class="col-3"><button class="btn-calc number" data-val="1">1</button></div>
                <div class="col-3"><button class="btn-calc number" data-val="2">2</button></div>
                <div class="col-3"><button class="btn-calc number" data-val="3">3</button></div>
                <div class="col-3"><button class="btn-calc decimal" data-val=".">.</button></div>
            </div>
            <div class="row g-2 btn-row">
                <div class="col-6"><button class="btn-calc number span-two" data-val="0">0</button></div>
                <div class="col-6"><button class="btn-calc equals span-two" data-val="=">=</button></div>
            </div>
        </div>

        <div class="panel" id="panel-conv">
            <div class="converter-display" id="convDisplayDuration">
                <div class="conv-label">Enter value</div>
                <input class="conv-input" id="convInput" type="text" inputmode="decimal" placeholder="0">
                <div class="conv-label" style="margin-top:8px;">Result</div>
                <div class="conv-result" id="convResult">0</div>
            </div>

            <div class="conv-category">
                <div class="conv-category-label">Category</div>
                <div class="conv-category-btns" id="catBtns">
                    <button class="conv-cat-btn active" data-cat="time">Time</button>
                    <button class="conv-cat-btn" data-cat="length">Length</button>
                    <button class="conv-cat-btn" data-cat="weight">Weight</button>
                    <button class="conv-cat-btn" data-cat="temperature">Temp</button>
                    <button class="conv-cat-btn" data-cat="volume">Volume</button>
                    <button class="conv-cat-btn" data-cat="area">Area</button>
                </div>
            </div>

            <div class="conv-subtabs" id="timeSubtabs">
                <button class="conv-subtab active" data-sub="duration">&#9201; Duration</button>
                <button class="conv-subtab" data-sub="date">&#128197; Date</button>
            </div>

            <div id="convDurationSection">
                <div class="conv-select-group">
                    <div class="conv-select-wrap">
                        <select class="conv-select" id="convFrom"></select>
                    </div>
                    <button class="conv-swap" id="convSwap">&#8646;</button>
                    <div class="conv-select-wrap">
                        <select class="conv-select" id="convTo"></select>
                    </div>
                </div>

                <div class="conv-numpad">
                    <button class="btn-calc number" data-conv="7">7</button>
                    <button class="btn-calc number" data-conv="8">8</button>
                    <button class="btn-calc number" data-conv="9">9</button>
                    <button class="btn-calc clear" data-conv="C">C</button>
                    <button class="btn-calc number" data-conv="4">4</button>
                    <button class="btn-calc number" data-conv="5">5</button>
                    <button class="btn-calc number" data-conv="6">6</button>
                    <button class="btn-calc delete" data-conv="DEL">DEL</button>
                    <button class="btn-calc number" data-conv="1">1</button>
                    <button class="btn-calc number" data-conv="2">2</button>
                    <button class="btn-calc number" data-conv="3">3</button>
                    <button class="btn-calc equals" data-conv="=">=</button>
                    <button class="btn-calc number span-two" data-conv="0" style="aspect-ratio:auto;">0</button>
                    <button class="btn-calc decimal" data-conv=".">.</button>
                </div>
            </div>

            <div class="conv-date-section" id="convDateSection">
                <div class="date-row">
                    <span class="date-label">From</span>
                    <select class="date-input" id="dateFromType" style="flex:0 0 auto;width:auto;cursor:pointer;">
                        <option value="gregorian">CE</option>
                        <option value="hijri">Hijri</option>
                    </select>
                    <button class="date-swap-btn" id="dateTypeSwap">&#8646;</button>
                    <span class="date-label">To</span>
                    <select class="date-input" id="dateToType" style="flex:0 0 auto;width:auto;cursor:pointer;">
                        <option value="hijri">Hijri</option>
                        <option value="gregorian">CE</option>
                    </select>
                </div>

                <div class="date-row" id="gregorianInputs">
                    <span class="date-label">CE</span>
                    <input class="date-input" id="dateDay" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Day" style="flex:1;">
                    <input class="date-input" id="dateMonth" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Month" style="flex:1;">
                    <input class="date-input" id="dateYear" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Year" style="flex:1;">
                </div>

                <div class="date-row" id="hijriInputs" style="display:none;">
                    <span class="date-label">HIJ</span>
                    <input class="date-input" id="hijriDay" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Day" style="flex:1;">
                    <select class="date-input" id="hijriMonth" style="flex:2;cursor:pointer;">
                        <option value="1">Muharram</option>
                        <option value="2">Safar</option>
                        <option value="3">Rabi' I</option>
                        <option value="4">Rabi' II</option>
                        <option value="5">Jumada I</option>
                        <option value="6">Jumada II</option>
                        <option value="7">Rajab</option>
                        <option value="8">Sha'ban</option>
                        <option value="9">Ramadan</option>
                        <option value="10">Shawwal</option>
                        <option value="11">Dhu'l-Qi'dah</option>
                        <option value="12">Dhu'l-Hijjah</option>
                    </select>
                    <input class="date-input" id="hijriYear" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Year" style="flex:1;">
                </div>

                <div class="date-result-box">
                    <div class="date-result-label">Converted Date</div>
                    <div class="date-result-value hijri" id="dateResult">--</div>
                </div>
            </div>
        </div>

        <div class="footer-text calc-footer">&#9835; FUNKY CALCULATOR &#9835;</div>
    </div>

    <script src="script.js?v=3"></script>

</body>

</html>
